<!DOCTYPE html>
<html>
<body>
<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 1200 1200">
<style>
#controls {
	position: fixed;
	bottom: 20px;
	left: 50%;
	transform: translateX(-50%);
	display: flex;
	align-items: center;
	gap: 16px;
	font-family: Arial, sans-serif;
}
#controls button {
	font-size: 14px;
	cursor: center;
}
#turnLabel {
	min-width: 100px;
	text-align: center;
}
</style>
<line x1="0.000000" y1="70.000000" x2="940.000000" y2="0.000000" stroke="grey" stroke-width="2.00"/>
<line x1="0.000000" y1="70.000000" x2="40.000000" y2="1000.000000" stroke="grey" stroke-width="2.00"/>
<line x1="940.000000" y1="0.000000" x2="990.000000" y2="950.000000" stroke="grey" stroke-width="2.00"/>
<line x1="40.000000" y1="1000.000000" x2="990.000000" y2="950.000000" stroke="grey" stroke-width="2.00"/>
<g class="station">
<circle id="station_003" cx="990.000000" cy="950.000000" r="6.00" stroke="black"/>
<text x="1002.00" y="943.00" text-anchor="start" font-family="Arial" font-size="20.00" fill="black" stroke="white" stroke-width="2.8" paint-order="stroke">station_003</text>
</g>
<g class="station">
<circle id="station_001" cx="940.000000" cy="0.000000" r="6.00" stroke="black"/>
<text x="952.00" y="-7.00" text-anchor="start" font-family="Arial" font-size="20.00" fill="black" stroke="white" stroke-width="2.8" paint-order="stroke">station_001</text>
</g>
<g class="station">
<circle id="station_002" cx="40.000000" cy="1000.000000" r="6.00" stroke="black"/>
<text x="52.00" y="993.00" text-anchor="start" font-family="Arial" font-size="20.00" fill="black" stroke="white" stroke-width="2.8" paint-order="stroke">station_002</text>
</g>
<g class="station">
<circle id="station_000" cx="0.000000" cy="70.000000" r="6.00" stroke="black"/>
<text x="12.00" y="63.00" text-anchor="start" font-family="Arial" font-size="20.00" fill="black" stroke="white" stroke-width="2.8" paint-order="stroke">station_000</text>
</g>
<g class="train" id="T1" visibility="hidden">
<circle cx="%!f(int=0)" cy="%!f(int=0)" r="4.80" fill="brown" stroke="brown"/>
<text x="%!f(int=0)" y="%!f(int=0)" font-family="Arial" font-size="20.00" fill="black" stroke="white" stroke-width="2.5" paint-order="stroke">T1</text>
</g>
<g class="train" id="T2" visibility="hidden">
<circle cx="%!f(int=0)" cy="%!f(int=0)" r="4.80" fill="brown" stroke="brown"/>
<text x="%!f(int=0)" y="%!f(int=0)" font-family="Arial" font-size="20.00" fill="black" stroke="white" stroke-width="2.5" paint-order="stroke">T2</text>
</g>
<g class="train" id="T3" visibility="hidden">
<circle cx="%!f(int=0)" cy="%!f(int=0)" r="4.80" fill="brown" stroke="brown"/>
<text x="%!f(int=0)" y="%!f(int=0)" font-family="Arial" font-size="20.00" fill="black" stroke="white" stroke-width="2.5" paint-order="stroke">T3</text>
</g>
</svg>
<div id="controls">
	<button id="prev">Previous</button>
	<span id="turnLabel"></span>
	<button id="next">Next</button>
</div>
<script>


//viewbox panning/zooming
const svg = document.getElementById("map");
const viewBox = svg.viewBox.baseVal;

let dragging = false;
let lastX = 0;
let lastY = 0;

svg.addEventListener("wheel", e => {
	e.preventDefault();
	const rect = svg.getBoundingClientRect();
	const mouseX = (e.clientX - rect.left) / rect.width;
	const mouseY = (e.clientY - rect.top) / rect.height;
	const oldWidth = viewBox.width;
	const oldHeight = viewBox.height;
	const factor = 1.2;

	if (e.deltaY < 0) {
		viewBox.width /= factor;
		viewBox.height /= factor;
	} else {
		viewBox.width *= factor;
		viewBox.height *= factor;
	}

	const widthDiff = oldWidth - viewBox.width;
	const heightDiff = oldHeight - viewBox.height;

	viewBox.x += widthDiff * mouseX;
	viewBox.y += heightDiff * mouseY;
});

svg.addEventListener("mousedown", e => {
	dragging = true;
	lastX = e.clientX;
	lastY = e.clientY;
});

window.addEventListener("mouseup", () => {
	dragging = false;
});

window.addEventListener("mousemove", e => {

	if (!dragging) {
		return;
	}

	const dx = e.clientX - lastX;
	const dy = e.clientY - lastY;

	viewBox.x -= dx * (viewBox.width / svg.clientWidth);
	viewBox.y -= dy * (viewBox.height / svg.clientHeight);

	lastX = e.clientX;
	lastY = e.clientY;
});
window.addEventListener("keydown", e => {
	if (e.key === "ArrowLeft") {
		e.preventDefault();
		document.getElementById("prev").click();
	} else if (e.key === "ArrowRight") {
		e.preventDefault();
		document.getElementById("next").click();
	}
});
const turns = [
"T1-station_011",
"T1-station_021 T2-station_011",
"T1-station_022 T2-station_021",
"T1-station_032 T2-station_022",
"T1-station_033 T2-station_032",
"T1-station_034 T2-station_033",
"T2-station_034",
];
let currentTurn = 0
function updateButtons() {
	document.getElementById("turnLabel").textContent =
		"Turn " + (currentTurn + 1) + " / " + turns.length;
	document.getElementById("prev").disabled = currentTurn === 0;
	document.getElementById("next").disabled = currentTurn === turns.length - 1;
}
function showTurn(currentTurn) {
	document.querySelectorAll(".train").forEach(train => {
		train.setAttribute("visibility", "hidden");
	});
	const entries = turns[currentTurn].split(" ");
	for (const entry of entries) {
		const [trainName, stationName] = entry.split("-");
		const station = document.getElementById(stationName);
		const train = document.getElementById(trainName);
		const x = station.cx.baseVal.value;
		const y = station.cy.baseVal.value;

		train.setAttribute("visibility", "visible");
		//x + offset + offset of offset (+12 +10), y (+10 -7)
		train.querySelector("circle").setAttribute("cx", x+10);
		train.querySelector("circle").setAttribute("cy", y+10);
		train.querySelector("text").setAttribute("x", x+22);
		train.querySelector("text").setAttribute("y", y+3);
		}
	}

	document.getElementById("prev").onclick = () => {
		if (currentTurn > 0) {
			currentTurn--;
			showTurn(currentTurn);
			updateButtons();
		}
	};
	document.getElementById("next").onclick = () => {
		if (currentTurn + 1 < turns.length) {
			currentTurn++;
			showTurn(currentTurn);
			updateButtons();
		}
	};
showTurn(currentTurn);
updateButtons();
</script>
</body>
</html>
